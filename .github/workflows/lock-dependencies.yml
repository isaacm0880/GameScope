name: Update dependency lock

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve direct and transitive runtime dependencies
        run: |
          python -m pip install 'pip-tools==7.5.2'
          pip-compile --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
      - name: Create or update lockfile PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh Python dependency lock'
          branch: chore/refresh-dependency-lock
          delete-branch: true
          title: 'chore: refresh Python dependency lock'
          body: 'Automatically resolved and hashed using Python 3.12. Review CI checks before merging.'
          add-paths: requirements.lock
