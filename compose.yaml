services:
  gamescope:
    build: .
    container_name: gamescope
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CACHE_SECONDS: ${CACHE_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SETTINGS_DB: /data/settings.sqlite3
    volumes:
      - gamescope-settings:/data
    init: true

volumes:
  gamescope-settings:
